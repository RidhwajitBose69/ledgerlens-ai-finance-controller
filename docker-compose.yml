version: '3.8'

services:
  mongodb:
    image: mongo:8.0
    container_name: ledgerlens-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ledgerlens
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ledgerlens-api
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=ledgerlens
      - LOG_LEVEL=INFO
      - AI_PROVIDER=mock
    depends_on:
      mongodb:
        condition: service_healthy
    restart: always

volumes:
  mongo_data:
